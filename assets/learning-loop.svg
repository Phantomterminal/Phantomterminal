<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 190" width="1120" height="190" role="img" aria-labelledby="t d">
<title id="t">The Phantomterminal learning loop</title><desc id="d">Learn, build, test, document, repeat: a continuous engineering feedback loop.</desc>
<defs>
 <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79f6ff"/><stop offset=".5" stop-color="#a996ff"/><stop offset="1" stop-color="#ff66da"/></linearGradient>
 <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.node{fill:#0c1321;stroke:url(#g);stroke-width:1.5}.label{fill:#edf5ff;font-size:17px;font-weight:700;letter-spacing:1px}.num{fill:#7b91ae;font-size:10px;letter-spacing:2px}.sub{fill:#8496b1;font-size:11px}</style>
</defs>
<rect x="1" y="1" width="1118" height="188" rx="16" fill="#080c16" stroke="#253149"/>
<path d="M110 83H1010" stroke="#263b53" stroke-width="2" stroke-dasharray="5 8"/>
<path d="M110 83H1010" stroke="url(#g)" stroke-width="1.5" opacity=".68" filter="url(#gl)"/>
<g>
 <rect class="node" x="32" y="43" width="184" height="80" rx="10"/><text class="num" x="50" y="64">01 / INPUT</text><text class="label" x="50" y="88">LEARN</text><text class="sub" x="50" y="107">Study the system</text>
 <rect class="node" x="257" y="43" width="184" height="80" rx="10"/><text class="num" x="275" y="64">02 / CREATE</text><text class="label" x="275" y="88">BUILD</text><text class="sub" x="275" y="107">Turn ideas into tools</text>
 <rect class="node" x="482" y="43" width="184" height="80" rx="10"/><text class="num" x="500" y="64">03 / VERIFY</text><text class="label" x="500" y="88">TEST</text><text class="sub" x="500" y="107">Measure what works</text>
 <rect class="node" x="707" y="43" width="184" height="80" rx="10"/><text class="num" x="725" y="64">04 / SHARE</text><text class="label" x="725" y="88">DOCUMENT</text><text class="sub" x="725" y="107">Make it reproducible</text>
 <rect class="node" x="932" y="43" width="156" height="80" rx="10"/><text class="num" x="950" y="64">05 / ITERATE</text><text class="label" x="950" y="88">REPEAT ↻</text><text class="sub" x="950" y="107">Improve the loop</text>
</g>
<g fill="#79f6ff"><path d="M226 78l8 5-8 5z"/><path d="M451 78l8 5-8 5z"/><path d="M676 78l8 5-8 5z"/><path d="M901 78l8 5-8 5z"/></g>
<path d="M1010 133v22H123v-22" fill="none" stroke="url(#g)" stroke-width="1.4" stroke-dasharray="4 5"/>
<path d="M123 132l-5 8h10z" fill="#79f6ff"/>
<text x="560" y="174" fill="#8193ae" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle" letter-spacing="2">PROGRESS IS A FEEDBACK LOOP — NOT A FINISH LINE</text>
</svg>