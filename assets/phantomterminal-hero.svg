<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Phantomterminal — cyberpunk developer profile</title>
  <desc id="desc">An animated neon terminal interface for a developer exploring cybersecurity, software engineering, and applied AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/>
      <stop offset=".52" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#12091e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6df7ff"/>
      <stop offset=".52" stop-color="#9e8cff"/>
      <stop offset="1" stop-color="#ff5cdb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2b" stop-opacity=".96"/>
      <stop offset="1" stop-color="#090d17" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#7b61ff" stop-opacity=".27"/>
      <stop offset=".6" stop-color="#5b46cc" stop-opacity=".08"/>
      <stop offset="1" stop-color="#5b46cc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7af7ff" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.3" fill="#7af7ff" fill-opacity=".16"/>
    </pattern>
    <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".65" fill="#a2efff" fill-opacity=".24"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="26"/></clipPath>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .muted{fill:#7f91ad}
      .cyan{fill:#79f6ff}
      .pink{fill:#ff66da}
      .white{fill:#edf5ff}
      .tiny{font-size:11px;letter-spacing:2.6px}
      .dash{stroke-dasharray:8 14;animation:dash 22s linear infinite}
      .orbit{transform-origin:920px 185px;animation:orbit 28s linear infinite}
      .float{animation:float 7s ease-in-out infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .scan{animation:scan 6.5s linear infinite}
      .blink{animation:blink 1.1s steps(2,end) infinite}
      .glitch{animation:glitch 8s steps(1,end) infinite}
      @keyframes dash{to{stroke-dashoffset:-440}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(-470px);opacity:0}10%{opacity:.8}90%{opacity:.5}100%{transform:translateY(470px);opacity:0}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @keyframes glitch{0%,94%,100%{transform:translate(0)}95%{transform:translate(2px,-1px)}96%{transform:translate(-2px,1px)}97%{transform:translate(1px,0)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <rect width="1280" height="440" fill="url(#micro)" opacity=".23"/>
    <ellipse cx="930" cy="180" rx="340" ry="270" fill="url(#aura)"/>
    <ellipse cx="118" cy="395" rx="280" ry="190" fill="#0ce8e8" opacity=".035"/>
    <path d="M0 334H1280M0 336H1280" stroke="#7af7ff" stroke-opacity=".13"/>
    <path d="M30 0V440M1250 0V440" stroke="#ff68de" stroke-opacity=".18"/>
    <g fill="none" stroke="url(#neon)" stroke-opacity=".44" stroke-width="1.2" class="dash">
      <path d="M-80 130H210L260 80H410"/>
      <path d="M1030 35H1165L1200 70H1330"/>
      <path d="M-60 365H150L192 323H300"/>
      <path d="M1010 398H1150L1190 358H1320"/>
    </g>
    <g class="orbit" fill="none" stroke="#86ecff" stroke-opacity=".22">
      <ellipse cx="920" cy="185" rx="235" ry="118" transform="rotate(-26 920 185)"/>
      <ellipse cx="920" cy="185" rx="250" ry="91" transform="rotate(36 920 185)"/>
      <ellipse cx="920" cy="185" rx="176" ry="142" transform="rotate(72 920 185)"/>
      <circle cx="1151" cy="110" r="4" fill="#ff66da" stroke="none" filter="url(#glow)"/>
      <circle cx="723" cy="238" r="3.5" fill="#79f6ff" stroke="none" filter="url(#glow)"/>
    </g>
    <g opacity=".8">
      <circle cx="1100" cy="70" r="2" fill="#ff66da" class="pulse"/>
      <circle cx="680" cy="317" r="2" fill="#79f6ff" class="pulse"/>
      <circle cx="440" cy="56" r="1.8" fill="#79f6ff" class="pulse"/>
      <circle cx="125" cy="294" r="1.6" fill="#ff66da" class="pulse"/>
      <path d="M30 30h70M30 30v28M1250 30h-70M1250 30v28M30 410h70M30 410v-28M1250 410h-70M1250 410v-28" stroke="#80f5ff" stroke-opacity=".7" fill="none"/>
    </g>

    <g transform="translate(64 53)">
      <circle cx="7" cy="0" r="4" fill="#63ffbc" filter="url(#glow)"/>
      <text x="21" y="4" class="tiny cyan">PHANTOM TERMINAL / OPERATOR PROFILE</text>
      <text x="0" y="35" class="tiny muted">SYSTEMS THINKING · SECURITY MINDED · BUILDING IN PUBLIC</text>
    </g>

    <g class="glitch">
      <text x="60" y="164" font-size="67" font-weight="800" letter-spacing="-2" fill="#79f6ff" opacity=".15">SWASTIK</text>
      <text x="56" y="160" font-size="67" font-weight="800" letter-spacing="-2" class="white">SWASTIK</text>
      <text x="57" y="222" font-size="67" font-weight="800" letter-spacing="-2" fill="url(#neon)">DWIVEDI</text>
    </g>
    <path d="M62 244H538" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <text x="64" y="277" font-size="17" font-weight="700" letter-spacing="2.2" class="white">SECURITY × SOFTWARE × APPLIED AI</text>
    <text x="64" y="308" font-size="14" class="muted">Explore the system. Understand the risk.</text>
    <text x="64" y="330" font-size="14" class="muted">Build tools that make the next step clearer.</text>

    <g transform="translate(64 357)">
      <rect x="0" y="0" width="142" height="29" rx="5" fill="#0c1a27" stroke="#79f6ff" stroke-opacity=".65"/>
      <text x="15" y="19" font-size="11" letter-spacing="1.4" class="cyan">[ PYTHON ]</text>
      <rect x="153" y="0" width="144" height="29" rx="5" fill="#171327" stroke="#b49bff" stroke-opacity=".65"/>
      <text x="168" y="19" font-size="11" letter-spacing="1.4" fill="#c5b4ff">[ CYBERSEC ]</text>
      <rect x="308" y="0" width="111" height="29" rx="5" fill="#1b1122" stroke="#ff66da" stroke-opacity=".65"/>
      <text x="323" y="19" font-size="11" letter-spacing="1.4" class="pink">[ AI / LLM ]</text>
    </g>

    <g class="float">
      <rect x="694" y="66" width="520" height="290" rx="13" fill="#01030a" fill-opacity=".58" stroke="#79f6ff" stroke-opacity=".18" stroke-width="8"/>
      <rect x="694" y="66" width="520" height="290" rx="13" fill="url(#panel)" stroke="url(#neon)" stroke-opacity=".8" stroke-width="1.4"/>
      <path d="M695 108H1213" stroke="#79f6ff" stroke-opacity=".25"/>
      <circle cx="719" cy="87" r="4" fill="#ff647c"/>
      <circle cx="735" cy="87" r="4" fill="#ffd166"/>
      <circle cx="751" cy="87" r="4" fill="#63ffbc"/>
      <text x="779" y="91" font-size="11" letter-spacing="1.5" class="muted">operator@phantom:~</text>
      <text x="1176" y="91" font-size="10" text-anchor="end" class="cyan">LIVE</text>

      <text x="722" y="139" font-size="13" class="cyan">$ whoami</text>
      <text x="722" y="160" font-size="13" class="white">swastik.dwivedi</text>

      <text x="722" y="194" font-size="13" class="pink">$ focus --now</text>
      <text x="722" y="215" font-size="12" class="white">security labs / Python / local AI</text>

      <text x="722" y="249" font-size="13" class="cyan">$ workflow --ethics</text>
      <text x="722" y="270" font-size="12" class="white">learn → test → document → improve</text>

      <text x="722" y="304" font-size="13" class="pink">$ mission --status</text>
      <text x="722" y="325" font-size="12" class="white">AUTHORIZED TESTING ONLY</text>
      <rect x="940" y="314" width="8" height="14" rx="1" fill="#79f6ff" class="blink"/>
    </g>

    <rect x="694" y="370" width="520" height="28" rx="5" fill="#0b1220" stroke="#7c8da9" stroke-opacity=".25"/>
    <text x="711" y="388" font-size="10" letter-spacing="1.4" class="muted">[ SIGNAL LOCKED ]</text>
    <text x="1196" y="388" font-size="10" text-anchor="end" class="cyan">STAY CURIOUS · SHIP WITH INTENT</text>

    <rect class="scan" x="0" y="0" width="1280" height="2" fill="#78f7ff" opacity=".6" filter="url(#glow)"/>
    <rect x="0" y="0" width="1280" height="440" fill="none" stroke="#263449" stroke-width="2"/>
  </g>
</svg>